<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Luxe · Kokoro voice test</title>
<style>
  body { margin: 0; padding: 20px 16px 40px; font-family: system-ui, sans-serif; background: #0B0F14; color: #E5E7EB; }
  h1 { font-size: 20px; margin: 0 0 4px; } p { color: #9CA3AF; font-size: 13.5px; line-height: 1.5; }
  label { display: block; font-size: 12px; color: #9CA3AF; margin: 14px 0 6px; font-weight: 700; letter-spacing: .5px; }
  select, textarea, button { width: 100%; box-sizing: border-box; font: inherit; border-radius: 12px; border: 1px solid #263041; background: #111827; color: #E5E7EB; padding: 10px 12px; }
  textarea { min-height: 96px; }
  button { margin-top: 12px; background: #34D399; color: #04130D; font-weight: 800; border: 0; padding: 13px; }
  button:disabled { opacity: .5; }
  #log { margin-top: 14px; font-family: ui-monospace, monospace; font-size: 12.5px; white-space: pre-wrap; color: #A7F3D0; background: #05080C; border-radius: 12px; padding: 10px; min-height: 60px; }
  audio { width: 100%; margin-top: 12px; }
</style>
</head>
<body>
  <h1>🎙️ Kokoro voice test</h1>
  <p>Kokoro runs on this phone, with no account and no limit. The first time, it downloads the voice model (about 90 MB, once), so use Wi-Fi if you can. Then try a few voices and watch how long each line takes.</p>

  <label>VOICE</label>
  <select id="voice">
    <option value="am_michael">am_michael · American man (warm)</option>
    <option value="am_adam">am_adam · American man</option>
    <option value="am_fenrir">am_fenrir · American man (deeper)</option>
    <option value="am_puck">am_puck · American man (lively)</option>
    <option value="am_echo">am_echo · American man</option>
    <option value="am_eric">am_eric · American man</option>
    <option value="am_liam">am_liam · American man</option>
    <option value="am_onyx">am_onyx · American man (low)</option>
    <option value="bm_george">bm_george · British man</option>
    <option value="bm_lewis">bm_lewis · British man</option>
    <option value="bm_daniel">bm_daniel · British man</option>
    <option value="bm_fable">bm_fable · British man</option>
  </select>

  <label>LINE</label>
  <textarea id="text">Alright, class. Today we teach a computer to spot spam, and no, it will not be as clever as you. Yet. Let us start with the data.</textarea>

  <label>QUALITY</label>
  <select id="dtype">
    <option value="q8">q8 · 92 MB, faster (try first)</option>
    <option value="fp32">fp32 · full quality, 325 MB download</option>
  </select>

  <button id="go">▶ Load and speak</button>
  <div style="margin-top:12px;height:8px;border-radius:4px;background:#1F2937;overflow:hidden"><div id="bar" style="height:100%;width:0;background:#34D399;transition:width .3s"></div></div>
  <div id="pct" style="font-size:12px;color:#9CA3AF;margin-top:6px">The first tap downloads the voice model (about 92 MB, once).</div>
  <audio id="player" controls></audio>
  <div id="log">Ready.</div>

<script>
  // Kokoro runs in a background worker, so the page never freezes while it downloads or speaks.
  const $ = (id) => document.getElementById(id);
  const log = (t) => { $('log').textContent += `\n${t}`; };
  const WORKER = `
    let tts = null, type = null;
    onmessage = async (e) => {
      const { text, voice, dtype } = e.data;
      try {
        if (!tts || type !== dtype) {
          const { KokoroTTS } = await import('https://cdn.jsdelivr.net/npm/kokoro-js@1/+esm');
          tts = await KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX', {
            dtype, device: 'wasm',
            progress_callback: (p) => { if (p.status === 'progress' && /onnx$/.test(p.file || '')) postMessage({ type: 'progress', pct: p.progress, loaded: p.loaded, total: p.total }); },
          });
          type = dtype; postMessage({ type: 'loaded' });
        }
        const t = performance.now();
        const a = await tts.generate(text, { voice });
        const samples = a.audio;
        postMessage({ type: 'audio', samples, rate: a.sampling_rate, secs: (performance.now() - t) / 1000 }, [samples.buffer]);
      } catch (err) { postMessage({ type: 'error', msg: String((err && err.message) || err) }); }
    };`;
  const worker = new Worker(URL.createObjectURL(new Blob([WORKER], { type: 'text/javascript' })), { type: 'module' });
  let started = 0, lastPct = -10;
  // 16-bit WAV from the raw samples, so the normal audio player can play it.
  function wav(samples, rate) {
    const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, samples.length * 2, true);
    for (let i = 0; i < samples.length; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, samples[i])) * 0x7fff, true);
    return new Blob([buf], { type: 'audio/wav' });
  }
  worker.onmessage = (e) => {
    const d = e.data;
    if (d.type === 'progress') {
      if (d.pct - lastPct >= 5 || d.pct >= 100) { lastPct = d.pct; $('bar').style.width = `${d.pct.toFixed(0)}%`; $('pct').textContent = `Downloading the voice model: ${d.pct.toFixed(0)}% (${(d.loaded / 1e6).toFixed(0)} of ${(d.total / 1e6).toFixed(0)} MB)`; }
    } else if (d.type === 'loaded') {
      $('pct').textContent = 'Voice model ready (saved for next time).'; $('bar').style.width = '100%';
      log(`Loaded in ${((performance.now() - started) / 1000).toFixed(1)} s. Now making the speech…`);
    } else if (d.type === 'audio') {
      $('player').src = URL.createObjectURL(wav(d.samples, d.rate));
      $('player').play().catch(() => {});
      const len = d.samples.length / d.rate;
      log(`Made ${len.toFixed(1)} s of speech in ${d.secs.toFixed(1)} s (${(len / d.secs).toFixed(2)}× real time; above 1× means it keeps up).`);
      $('go').disabled = false;
    } else if (d.type === 'error') { log(`Error: ${d.msg}`); $('go').disabled = false; }
  };
  worker.onerror = (e) => { log(`Error: ${e.message || 'the worker could not start'}`); $('go').disabled = false; };
  $('go').onclick = () => {
    $('go').disabled = true; started = performance.now(); lastPct = -10;
    $('log').textContent = `Speaking as ${$('voice').value} (${$('dtype').value})…`;
    worker.postMessage({ text: $('text').value.trim(), voice: $('voice').value, dtype: $('dtype').value });
  };
</script>
</body>
</html>
