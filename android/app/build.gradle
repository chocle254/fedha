plugins {
    id 'com.android.application'
}

// Signing comes from CI secrets (see .github/workflows/android.yml). Without them the build is unsigned.
def ksFile = System.getenv('KEYSTORE_FILE')
def ksPass = System.getenv('KEYSTORE_PASSWORD')

android {
    namespace 'com.chocle254.fedha'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chocle254.fedha'
        minSdk 21
        targetSdk 34
        versionCode = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName = "1.0.${System.getenv('VERSION_CODE') ?: '1'}"
        // libVLC ships a native engine per processor type; only 64-bit ARM phones (keeps the APK ~20 MB smaller).
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias 'fedha'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Luxe's own video player (PlayerActivity): libVLC, the engine inside VLC, so it plays almost any file.
    implementation 'org.videolan.android:libvlc-all:3.6.5'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
